<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a16"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <radialGradient id="luz" cx="50%" cy="8%" r="72%">
      <stop offset="0" stop-color="#00e884" stop-opacity=".38"/>
      <stop offset="1" stop-color="#00e884" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b6ffdc"/>
      <stop offset=".32" stop-color="#37ffa4"/>
      <stop offset=".58" stop-color="#00c66d"/>
      <stop offset=".78" stop-color="#5cffc0"/>
      <stop offset="1" stop-color="#009d55"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".26" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".40" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".52" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <rect width="512" height="512" rx="112" fill="url(#luz)"/>

  <!-- silhueta da carta, a mesma forma usada no app -->
  <g>
    <path d="M150 124.8 L173.3 96 L338.7 96 L362 124.8 L362 377.6 L256 416 L150 377.6 Z"
          fill="url(#metal)"/>
    <path d="M150 124.8 L173.3 96 L338.7 96 L362 124.8 L362 377.6 L256 416 L150 377.6 Z"
          fill="url(#brilho)"/>

    <!-- os 11 em campo: a tática desenhada sobre a carta -->
    <g fill="#05261a">
      <circle cx="200" cy="172" r="12"/><circle cx="256" cy="172" r="12"/><circle cx="312" cy="172" r="12"/>
      <circle cx="205" cy="232" r="12"/><circle cx="256" cy="232" r="12"/><circle cx="307" cy="232" r="12"/>
      <circle cx="186" cy="292" r="12"/><circle cx="233" cy="292" r="12"/>
      <circle cx="279" cy="292" r="12"/><circle cx="326" cy="292" r="12"/>
      <circle cx="256" cy="350" r="12"/>
    </g>
    <!-- linha do meio-campo -->
    <rect x="160" y="261" width="192" height="4" rx="2" fill="#05261a" opacity=".45"/>
  </g>
</svg>
