<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>NoTatiko — Monte seu time</title>
<meta name="description" content="NoTatiko: monte seu time de futebol com cards de score, escolha a tática e escale os 11. Funciona offline." />
<meta name="theme-color" content="#05070a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NoTatiko" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <div class="conteudo">

    <section class="coluna-campo">

      <!-- Placar do jogo: escudo à esquerda, tática e medalhas à direita.
           Uma linha só, sem barra e sem divisória: encosta no gramado. -->
      <div class="hud">
        <button class="emblema" id="btn-time" aria-label="Time: ver e editar">
          <span class="emblema-brasao" id="topo-escudo"></span>
          <span class="emblema-txt">
            <b id="topo-nome">Meu Time</b>
            <small id="topo-sub">Toque para configurar</small>
          </span>
        </button>

        <button class="medalha" id="metrica-forca" aria-label="Força do time">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle class="medalha-trilho" cx="20" cy="20" r="16" />
            <circle class="medalha-arco" cx="20" cy="20" r="16" id="arco-forca" />
          </svg>
          <b id="valor-forca">--</b>
          <span>Força</span>
        </button>

        <button class="medalha" id="metrica-encaixe" aria-label="Sintonia do time">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle class="medalha-trilho" cx="20" cy="20" r="16" />
            <circle class="medalha-arco" cx="20" cy="20" r="16" id="arco-sintonia" />
          </svg>
          <b id="valor-encaixe">--</b>
          <span>Sintonia</span>
        </button>

        <button class="btn-hud" id="btn-compartilhar" aria-label="Compartilhar a escalação"></button>

        <button class="btn-som" id="btn-som" aria-label="Trilha sonora"></button>
      </div>

      <div class="palco">

        <div class="gramado" id="gramado">
        <div class="gramado-fundo">
          <div class="grama"></div>
          <!-- as marcações são desenhadas em js/campo.js: o comprimento do
               campo acompanha a tela, e o círculo do meio nunca estica -->
          <svg class="linhas" id="linhas-campo" viewBox="0 0 680 907"
               preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        </div>
          <div class="slots" id="slots"></div>
        </div>
      </div>
    </section>

    <section class="coluna-elenco">
      <div class="elenco-topo">
        <div class="abas" role="tablist" aria-label="Elenco e comissão técnica">
          <button type="button" class="aba ativa" id="aba-elenco" role="tab"
                  aria-selected="true" aria-controls="trilho">
            Elenco <span class="contador" id="qtd-elenco">0</span>
          </button>
          <button type="button" class="aba" id="aba-comissao" role="tab"
                  aria-selected="false" aria-controls="trilho-comissao">
            Comissão <span class="contador" id="qtd-comissao">0</span>
          </button>
        </div>

        <button class="placa-tatica" id="btn-tatica" aria-label="Trocar tática">
          <b id="tatica-nome">4-3-3</b>
          <small id="tatica-variacao">Clássico</small>
        </button>
      </div>
      <div class="trilho" id="trilho" role="tabpanel" aria-labelledby="aba-elenco"></div>
      <div class="trilho trilho-comissao" id="trilho-comissao" role="tabpanel"
           aria-labelledby="aba-comissao" hidden></div>
    </section>

  </div>
</div>

<div class="camada-arrasto" id="camada-arrasto"></div>

<div class="folha-fundo" id="folha-fundo"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true">
  <div class="folha-alca" id="folha-alca"><span></span></div>
  <header class="folha-topo">
    <h2 id="folha-titulo"></h2>
    <button class="folha-fechar" id="folha-fechar" aria-label="Fechar"></button>
  </header>
  <div class="folha-corpo" id="folha-corpo"></div>
  <footer class="folha-rodape" id="folha-rodape"></footer>
</div>

<div class="dialogo-fundo" id="dialogo-fundo">
  <div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dialogo-titulo">
    <h3 id="dialogo-titulo"></h3>
    <p id="dialogo-texto"></p>
    <div class="dialogo-acoes">
      <button class="acao-redonda neutra" id="dialogo-nao"></button>
      <button class="acao-redonda perigo" id="dialogo-sim"></button>
    </div>
  </div>
</div>

<div class="revelacao" id="revelacao"><div class="revelacao-carta" id="revelacao-carta"></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
